<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handwriting to Word</title>
<style>
:root{--bg:#fafafa;--fg:#111;--mut:#666;--line:#ccc;--card:#fff;--acc:#111;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2;--mut:#999;--line:#444;--card:#1b1b1b;--acc:#f2f2f2;--accfg:#111}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2;--mut:#999;--line:#444;--card:#1b1b1b;--acc:#f2f2f2;--accfg:#111}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 16px}
.row{display:flex;gap:10px;margin-bottom:12px}
button,label.btn{flex:1;text-align:center;padding:14px 10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
button:disabled{opacity:.4}
input[type=file]{display:none}
.pages{display:grid;gap:10px;margin:14px 0}
.pg{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px}
.pg img{width:64px;height:84px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#fff}
.pg .t{flex:1;font-weight:600}
.pg button{flex:none;padding:8px 12px;font-size:15px}
.msg{color:var(--mut);min-height:22px;margin:8px 0}
.empty{border:1.5px dashed var(--line);border-radius:10px;padding:28px 12px;text-align:center;color:var(--mut)}
.res h2{font-size:17px;margin:18px 0 6px}
textarea{width:100%;min-height:220px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:16px/1.5 system-ui,sans-serif;resize:vertical}
input[type=text]{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit;margin-bottom:12px}
.hide{display:none}
.keybox{margin-bottom:14px}.keybox label{display:block;color:var(--mut);font-size:14px;margin-bottom:4px}.keybox input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<main>
<h1>Handwriting to Word</h1>
<p class="sub">Photograph handwritten pages. The words are read and turned into text you can edit, then saved as Word or PDF.</p>

<div class="keybox"><label for="key">Claude API key (stays on this phone only)</label><input id="key" type="password" placeholder="sk-ant-..." autocomplete="off"></div>
<div class="row">
  <label class="btn">Take photo<input id="cam" type="file" accept="image/*" capture="environment"></label>
  <label class="btn">From gallery<input id="gal" type="file" accept="image/*" multiple></label>
</div>
<div id="list" class="pages"></div>
<div class="row">
  <button id="clear">Clear all</button>
  <button id="read" class="pri" disabled>Read handwriting</button>
</div>
<button id="stop" class="hide" style="width:100%;margin-bottom:8px">Stop</button>
<div id="msg" class="msg"></div>

<div id="res" class="res hide">
  <div id="boxes"></div>
  <h2>Save</h2>
  <input id="name" type="text" value="handwriting" autocomplete="off">
  <div class="row">
    <button id="sw" class="pri">Word (.docx)</button>
    <button id="sp">PDF</button>
    <button id="st">Text</button>
  </div>
</div>
</main>

<script>
(function(){
  var pages=[],texts=[];
  var $=function(i){return document.getElementById(i)};
  var list=$('list'),msg=$('msg'),readBtn=$('read');
  function say(t){msg.textContent=t||'';}

  function render(){
    list.innerHTML='';
    if(!pages.length){var e=document.createElement('div');e.className='empty';e.textContent='No pages yet. Take a photo or pick from gallery.';list.appendChild(e);}
    pages.forEach(function(p,i){
      var d=document.createElement('div');d.className='pg';
      var im=document.createElement('img');im.src=p.url;im.alt='';
      var t=document.createElement('div');t.className='t';t.textContent='Page '+(i+1);
      d.appendChild(im);d.appendChild(t);
      [['↑',function(){mv(i,-1)},i===0],['↓',function(){mv(i,1)},i===pages.length-1],['✕',function(){rm(i)},false]].forEach(function(b){
        var x=document.createElement('button');x.textContent=b[0];x.disabled=b[2];x.onclick=b[1];d.appendChild(x);
      });
      list.appendChild(d);
    });
    readBtn.disabled=!pages.length;
  }
  function mv(i,d){var j=i+d;if(j<0||j>=pages.length)return;var t=pages[i];pages[i]=pages[j];pages[j]=t;render();}
  function rm(i){URL.revokeObjectURL(pages[i].url);pages.splice(i,1);render();}
  function add(files){
    for(var i=0;i<files.length;i++){var f=files[i];if(f.type&&f.type.indexOf('image')===0)pages.push({url:URL.createObjectURL(f),file:f});}
    render();say(pages.length+' page'+(pages.length===1?'':'s')+' ready.');
  }
  $('cam').onchange=function(e){add(e.target.files);e.target.value='';};
  $('gal').onchange=function(e){add(e.target.files);e.target.value='';};
  $('clear').onclick=function(){pages.forEach(function(p){URL.revokeObjectURL(p.url);});pages=[];$('res').classList.add('hide');$('boxes').innerHTML='';render();say('');};

  async function shrink(file){
    var bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
    var s=Math.min(1,2400/Math.max(bmp.width,bmp.height));
    var c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
    x.drawImage(bmp,0,0,c.width,c.height);
    if(bmp.close)bmp.close();
    return new Promise(function(r){c.toBlob(r,'image/jpeg',0.92);});
  }

  var PROMPT='You are an OCR engine for handwriting. Transcribe every word in this photo exactly as written, character for character. Rules: do not correct spelling or grammar, do not rephrase, do not summarize, do not translate, do not skip anything. Keep the same line breaks and paragraph breaks as the page. Keep numbers, punctuation, bullets and capital letters as written. If a word cannot be read, write [?] in its place instead of guessing. Output only the transcribed text, with no title, no comments and no markdown.';
  var ctl=null;
  var keyEl=$('key');
  try{keyEl.value=localStorage.getItem('hw_key')||'';}catch(e){}
  function b64(blob){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1]);};r.onerror=function(){rej(new Error('Could not read photo'));};r.readAsDataURL(blob);});}
  async function ocr(blob,key,signal){
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',signal:signal,
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:4096,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:'image/jpeg',data:await b64(blob)}},
        {type:'text',text:PROMPT}]}]})
    });
    var data=await resp.json().catch(function(){return {};});
    if(!resp.ok)throw new Error((data.error&&data.error.message)||('Request failed ('+resp.status+')'));
    return (data.content||[]).map(function(c){return c.type==='text'?c.text:'';}).join('').trim();
  }
  $('stop').onclick=function(){if(ctl)ctl.abort();};

  readBtn.onclick=async function(){
    if(!pages.length)return;
    var key=keyEl.value.trim();
    if(!key){say('Paste your Claude API key in the box above first.');return;}
    try{localStorage.setItem('hw_key',key);}catch(e){}
    readBtn.disabled=true;$('stop').classList.remove('hide');
    texts=[];$('boxes').innerHTML='';$('res').classList.remove('hide');
    var i,bad=0;
    for(i=0;i<pages.length;i++){
      var h=document.createElement('h2');h.textContent='Page '+(i+1);
      var ta=document.createElement('textarea');ta.placeholder='Waiting...';
      $('boxes').appendChild(h);$('boxes').appendChild(ta);texts[i]=ta;
    }
    ctl=new AbortController();
    for(i=0;i<pages.length;i++){
      var box=texts[i];
      say('Reading page '+(i+1)+' of '+pages.length+'...');box.placeholder='Reading...';
      try{
        box.value=await ocr(await shrink(pages[i].file),key,ctl.signal);
        if(!box.value)box.placeholder='No text found on this page.';
      }catch(err){
        if(err&&err.name==='AbortError'){box.placeholder='Stopped.';say('Stopped.');break;}
        bad++;box.placeholder='Failed: '+(err&&err.message||'unknown error');
        say('Page '+(i+1)+' failed: '+(err&&err.message||'unknown error'));
        if(/api key|authentication|401|credit|permission/i.test(err&&err.message||''))break;
      }
    }
    ctl=null;$('stop').classList.add('hide');
    if(!bad)say('Done. Compare with your page, fix any word, then save.');
    readBtn.disabled=!pages.length;
  };

  function getPages(){return texts.map(function(t){return t.value.replace(/\r/g,'');});}
  function nm(){return ($('name').value||'handwriting').replace(/[^\w\- ]+/g,'').trim()||'handwriting';}
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  async function buildDocx(){
    var body='';
    getPages().forEach(function(p,i){
      if(i>0)body+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
      p.split('\n').forEach(function(l){
        body+='<w:p><w:r><w:t xml:space="preserve">'+esc(l)+'</w:t></w:r></w:p>';
      });
    });
    var z=new JSZip();
    z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
    z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
    z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
    return z.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }

  // Simple text PDF (Helvetica, Latin characters)
  function buildPdf(){
    var enc=new TextEncoder(),chunks=[],offs=[],len=0;
    function push(u){chunks.push(u);len+=u.length;}
    function str(s){push(enc.encode(s));}
    var cv=document.createElement('canvas').getContext('2d');cv.font='12px Helvetica, Arial, sans-serif';
    var PW=595.28,PH=841.89,M=56,LH=16,maxW=PW-2*M,perPage=Math.floor((PH-2*M)/LH);
    var out=[];
    getPages().forEach(function(p){
      var lines=[];
      p.split('\n').forEach(function(l){
        if(!l.trim()){lines.push('');return;}
        var cur='';
        l.split(' ').forEach(function(w){
          var t=cur?cur+' '+w:w;
          if(cv.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;
        });
        lines.push(cur);
      });
      for(var i=0;i<Math.max(lines.length,1);i+=perPage)out.push(lines.slice(i,i+perPage));
    });
    var N=out.length;
    function hex(s){var h='';for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);if(c>255)c=63;h+=('0'+c.toString(16)).slice(-2);}return '<'+h+'>';}
    str('%PDF-1.4\n');
    offs[1]=len;str('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    var kids=[];for(var i=0;i<N;i++)kids.push((5+2*i)+' 0 R');
    offs[2]=len;str('2 0 obj\n<< /Type /Pages /Count '+N+' /Kids ['+kids.join(' ')+'] >>\nendobj\n');
    offs[3]=len;str('3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n');
    offs[4]=len;str('4 0 obj\n<< >>\nendobj\n');
    for(i=0;i<N;i++){
      var co=6+2*i,po=5+2*i,cs='BT /F1 12 Tf '+LH+' TL '+M+' '+(PH-M-10).toFixed(2)+' Td\n';
      out[i].forEach(function(l){cs+=hex(l)+' Tj T*\n';});
      cs+='ET';
      offs[po]=len;str(po+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R >> >> /Contents '+co+' 0 R >>\nendobj\n');
      offs[co]=len;str(co+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
    }
    var total=5+2*N,xr=len;
    str('xref\n0 '+total+'\n0000000000 65535 f \n');
    for(var n=1;n<total;n++)str(('0000000000'+offs[n]).slice(-10)+' 00000 n \n');
    str('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
    return new Blob(chunks,{type:'application/pdf'});
  }

  async function save(filename,getData){
    try{
      var data=await getData();
      var blob=data instanceof Blob?data:new Blob([data],{type:'text/plain;charset=utf-8'});
      var u=URL.createObjectURL(blob),el=document.createElement('a');
      el.href=u;el.download=filename;document.body.appendChild(el);el.click();el.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},4000);
      say('Saved '+filename+' to your Downloads.');
    }catch(err){say('Could not save: '+(err&&err.message||'unknown error'));}
  }
  $('sw').onclick=function(){save(nm()+'.docx',buildDocx);};
  $('sp').onclick=function(){save(nm()+'.pdf',buildPdf);};
  $('st').onclick=function(){save(nm()+'.txt',function(){return getPages().join('\n\n');});};
  render();
})();
</script>
</body>
</html>
